<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fortnite Llama Escape</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-img="{{ url_for('static', filename='img/') }}" data-audio="{{ url_for('static', filename='audio/') }}">
  <main>
    <header>
      <div>
        <h1>Fortnite Llama Escape</h1>
        <p class="tagline">Your Llama ran away. Find it before the storm does.</p>
      </div>
      <button id="mute-btn" type="button" class="small" aria-label="Sound on or off" aria-pressed="false">Sound: on (M)</button>
    </header>

    <section id="start" class="panel" hidden>
      <img class="pixel title" src="{{ url_for('static', filename='img/px/title.png') }}" alt="Your Fortnite character">
      <p id="start-note"></p>
      <div class="row">
        <button id="resume-btn" type="button" hidden>Resume game</button>
        <button id="new-btn" type="button">New game</button>
      </div>
      <p class="help">Walk with the arrow keys or WASD. Press SPACE to talk, use things and read signs. Press 1, 2 or 3 to choose.</p>
    </section>

    <section id="stage" hidden>
      <div id="hud">
        <img class="pixel avatar" src="{{ url_for('static', filename='img/px/avatar.png') }}" alt="">
        <div class="where"><span class="label">Location</span><strong id="place"></strong></div>
        <ul id="inventory" class="inventory" aria-label="Inventory"></ul>
        <button id="restart-btn" type="button" class="small secondary">New game</button>
      </div>
      <div class="screen">
        <canvas id="screen" width="960" height="576" aria-label="The island. Walk with the arrow keys."></canvas>
        <div id="dialog" hidden><p id="dialog-text"></p><span class="more">&#9660; SPACE</span></div>
        <div id="fade"></div>
      </div>
      <p id="hint" class="hint"></p>
    </section>

    <div id="modal" hidden><div id="modal-panel" class="panel"></div></div>
  </main>
  <script src="{{ url_for('static', filename='world.js') }}"></script>
  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
